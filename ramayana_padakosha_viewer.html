<!DOCTYPE html>
<html lang="sa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>रामायण-पदकोशः</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--teak:#171310;--teak2:#221C16;--leaf:#DCD1A2;--leaf2:#CDBF8B;--ink:#1D1910;--soft:#5B5238;--faint:#8C8260;--lac:#A5321F;--verd:#2D6A56;--indigo:#2E4A6E;--ochre:#8A6A1F;--cloth:#B9AE86}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--teak);color:var(--cloth);font:16px/1.55 'Gentium Book Plus',Georgia,serif}
.dv{font-family:'Tiro Devanagari Sanskrit','Noto Serif Devanagari','Nirmala UI',serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #E7C873;outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;padding:.8rem 1.2rem;background:var(--teak2);border-bottom:1px solid #3A3024}
.bar h1{margin:0;font:400 1.5rem 'Tiro Devanagari Sanskrit',serif;color:#EBDDAE;margin-right:auto}
.bar h1 small{font:italic .85rem 'Gentium Book Plus';color:var(--faint);margin-left:.7rem}
.seg{display:inline-flex;border:1px solid #4A3E2E;border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;padding:.35rem .9rem;cursor:pointer;color:var(--cloth)}
.seg button[aria-pressed=true]{background:var(--leaf);color:var(--ink)}
.btn{background:none;border:1px solid #4A3E2E;border-radius:4px;padding:.35rem .8rem;cursor:pointer;color:var(--cloth)}
.btn:hover{border-color:var(--leaf)}
.ruler{display:flex;gap:2px;padding:.9rem 1.2rem .3rem;max-width:1100px;margin:0 auto;overflow-x:auto}
.tick{flex:1 0 22px;min-width:22px;height:34px;border:0;background:#3A3024;border-radius:2px 2px 0 0;cursor:pointer;position:relative;color:var(--faint);font-size:.7rem;padding:0}
.tick[aria-current=true]{background:var(--leaf);color:var(--ink);font-weight:700}
.tick .dot{position:absolute;top:-5px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#E0644B}
main{max-width:1100px;margin:0 auto;padding:.4rem 1.2rem 4rem}
.leaf{position:relative;margin:1rem 0 1.4rem;padding:1.6rem 4.5rem;color:var(--ink);text-align:center;border-radius:10px / 38px;background:repeating-linear-gradient(180deg,rgba(60,45,10,.07) 0 1px,transparent 1px 7px),var(--leaf);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.leaf::before,.leaf::after{content:"";position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--teak);box-shadow:inset 0 2px 3px #000}
.leaf::before{left:2.2rem}.leaf::after{right:2.2rem}
.leaf .ref{font:italic .9rem 'Gentium Book Plus';color:var(--soft);margin-bottom:.6rem}
.leaf .l{font-family:'Tiro Devanagari Sanskrit','Noto Serif Devanagari','Nirmala UI',serif;font-size:clamp(1.35rem,3.6vw,2.15rem);line-height:1.5}
.leaf .i{font-style:italic;color:var(--soft);font-size:.95rem;margin-top:.15rem}
.leaf .nt{font-style:italic;color:var(--soft)}
.step{display:flex;gap:.6rem;align-items:center;justify-content:center;margin-bottom:1rem}
.step select{background:var(--teak2);border:1px solid #4A3E2E;border-radius:4px;padding:.3rem .5rem}
.step .btn:disabled{opacity:.35;cursor:default}
.head{display:grid;grid-template-columns:20px 1.15fr 1fr 1.2fr 150px 20px;gap:.8rem;padding:.2rem .9rem;font-size:.8rem;color:var(--faint)}
.row{background:var(--leaf);color:var(--ink);border-radius:3px;margin-bottom:5px;border-left:5px solid var(--ochre)}
.row.n{border-left-color:var(--indigo)}.row.s{border-left-color:var(--lac)}.row.k{border-left-color:var(--verd)}.row.v{border-left-color:#B5651D}.row.a{border-left-color:#6E6A58}.row.p{border-left-color:#6A4A7A}
.sum{display:grid;grid-template-columns:20px 1.15fr 1fr 1.2fr 150px 20px;gap:.8rem;align-items:center;padding:.55rem .9rem;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.sum:hover{background:rgba(255,255,255,.22)}
.pada{font:1.35rem/1.25 'Tiro Devanagari Sanskrit','Noto Serif Devanagari','Nirmala UI',serif}
.pada small{display:block;font:italic .85rem 'Gentium Book Plus';color:var(--soft)}
.dvs{font-family:'Tiro Devanagari Sanskrit','Noto Serif Devanagari','Nirmala UI',serif;font-size:1.05rem}
.muted{color:var(--soft);font-size:.85rem}
.chip{display:inline-block;font-size:.78rem;padding:1px 8px;border:1px solid var(--soft);border-radius:10px;color:var(--soft);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mk{width:14px;height:14px;border-radius:50%;border:2px solid var(--verd);background:var(--verd)}
.mk.c{background:linear-gradient(90deg,var(--verd) 50%,transparent 50%)}
.mk.r{background:transparent;border-color:var(--ochre)}
.mk.f{background:transparent;border-color:var(--lac);box-shadow:0 0 0 2px rgba(165,50,31,.25)}
.tg{justify-self:end;color:var(--soft);transition:transform .15s}
.row.open .tg{transform:rotate(90deg)}
.det{display:none;padding:.2rem 1rem 1rem 3.3rem;border-top:1px dashed var(--leaf2)}
.row.open .det{display:block}
dl{display:grid;grid-template-columns:max-content 1fr;gap:.25rem 1rem;margin:.6rem 0}
dt{color:var(--soft);font-size:.85rem}
dd{margin:0}
.parts{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0}
.parts span{background:var(--leaf2);padding:1px 9px;border-radius:3px}
.alt{font-size:.88rem;color:var(--soft)}
.flag{color:var(--lac);font-weight:700}
.sut{color:var(--lac);text-decoration:underline dotted}
table.pt{border-collapse:collapse;margin:.5rem 0;font-size:.95rem}
.pt th,.pt td{border:1px solid var(--leaf2);padding:2px 10px;text-align:left}
.pt th{color:var(--soft);font-weight:400;background:rgba(255,255,255,.2)}
.pt td.hit{background:var(--lac);color:#FFF4D6;font-weight:700}
.cap{font-size:.82rem;color:var(--soft)}
.tools{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:1rem 0}
.tools input[type=search]{flex:1 1 220px;background:var(--teak2);border:1px solid #4A3E2E;border-radius:4px;padding:.4rem .7rem}
.tools select{background:var(--teak2);border:1px solid #4A3E2E;border-radius:4px;padding:.38rem .5rem;max-width:210px}
.cnt{color:var(--faint);font-size:.9rem;margin-left:auto}
.note{max-width:1100px;margin:1rem auto 0;padding:0 1.2rem;font-size:.82rem;color:var(--faint)}
.empty{padding:2.5rem;text-align:center;color:var(--faint)}
body.drag::after{content:"JSON यहाँ मुञ्च · drop JSON to load";position:fixed;inset:0;display:grid;place-items:center;background:rgba(23,19,16,.9);color:#EBDDAE;font-size:1.6rem;z-index:9}
@media(max-width:760px){.head{display:none}.sum{grid-template-columns:20px 1fr 20px;gap:.2rem .6rem}.sum>:nth-child(3),.sum>:nth-child(4),.sum>:nth-child(5){grid-column:2}.sum>:nth-child(6){grid-row:1;grid-column:3}.det{padding-left:1rem}.leaf{padding:1.4rem 2.6rem}.leaf::before{left:.9rem}.leaf::after{right:.9rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  h+=table(w);
  if(w.meaning_en)h+='<p>'+esc(w.meaning_en)+'</p>';
  if(n.alts.length)h+='<p class="alt"><b>वैकल्पिकपठनानि:</b> '+n.alts.map(esc).join(' &nbsp;|&nbsp; ')+'</p>';
  var m=mark(w);
  h+='<p class="alt"><b'+(m[0]==='f'?' class="flag"':'')+'>'+esc(m[1])+'</b>'+(n.sam?' · समासप्रकारः '+esc(n.sam==='default'?'अनुमितः (default)':n.sam):'')+'</p>';
  return h;
}
function row(w,ctx){
  var m=mark(w),vt=ctx==='lex'?(w.verses||[]).slice(0,6).map(function(v){return 'श्लो.'+dn(v)}).join(' '):'';
  return '<div class="row '+cat(w)+(st.all?' open':'')+'"><button class="sum" aria-expanded="'+st.all+'">'+
    '<span class="mk '+m[0]+'" title="'+esc(m[1])+'"></span>'+
    '<span class="pada">'+esc(w.word)+'<small>'+esc(w.iast)+'</small></span>'+
    '<span class="dvs">'+esc(w.pratipadika||w.dhatu||'—')+'</span>'+
    '<span class="dvs muted">'+esc(gnc(w))+(vt?'<br>'+esc(vt):'')+'</span>'+
    '<span><span class="chip dvs" title="'+esc(w.word_type)+'">'+esc(short(w.word_type))+(w.samasa_type?' · '+esc(short(w.samasa_type)):'')+'</span></span>'+
    '<span class="tg">›</span></button><div class="det">'+detail(w)+'</div></div>';
}
var HEAD='<div class="head"><span></span><span>पदम्</span><span>प्रातिपदिकम् / धातुः</span><span>विभक्तिः · वचनम् · लिङ्गम्</span><span>प्रकारः</span><span></span></div>';

function vtext(v){
  var k=KANDAS[Object.keys(KANDAS).filter(function(x){return (data.corpus_meta.kanda||'').indexOf(x)>-1})[0]]||0;
  return (k===VT.k&&data.corpus_meta.sarga===VT.s)?VT.v[v]:null;
}
function ordered(v){
  var ws=st.words.filter(function(w){return (w.verses||[]).indexOf(v)>-1});
  var t=vtext(v);if(!t)return ws;
  var sp=' '+t.i.join(' ').toLowerCase().replace(/[-'’]/g,'')+' ';
  var pos=ws.map(function(w,ix){
    var p=String(w.iast||'').toLowerCase().replace(/[-\s'’]/g,''),
        q=p.slice(0,p.length<=3?p.length:Math.max(3,p.length-2)),i=sp.indexOf(' '+q);
    if(i<0)i=sp.indexOf(q);
    return {w:w,i:i<0?1e6:i,ix:ix}});
  pos.sort(function(a,b){return a.i-b.i||a.ix-b.ix});
  return pos.map(function(x){return x.w});
}
function ruler(){
  var h='';st.verses.forEach(function(v){
    var ws=st.words.filter(function(w){return (w.verses||[]).indexOf(v)>-1}),f=ws.some(flagged);
    h+='<button class="tick" data-v="'+v+'" aria-current="'+(v===st.v)+'" title="श्लोकः '+dn(v)+' · '+dn(ws.length)+' पदानि'+(f?' · परीक्षणीयानि सन्ति':'')+'">'+(f?'<span class="dot"></span>':'')+dn(v)+'</button>'});
  $('ruler').innerHTML=h;
}
function renderVerse(){
  var v=st.v,t=vtext(v),ws=ordered(v),i=st.verses.indexOf(v),meta=data.corpus_meta||{};
  var opts=st.verses.map(function(x){return '<option value="'+x+'"'+(x===v?' selected':'')+'>श्लोकः '+dn(x)+'</option>'}).join('');
  var leaf='<div class="leaf"><div class="ref">'+esc((meta.kanda||'').split('/')[0].trim())+' · सर्गः '+dn(meta.sarga)+' · श्लोकः '+dn(v)+'</div>'+
    (t?t.d.map(function(l,j){return '<div class="l">'+esc(l)+(j===t.d.length-1?' ॥ '+dn(meta.sarga)+'.'+dn(v)+' ॥':' ।')+'</div>'}).join('')+
       '<div class="i">'+esc(t.i.join(' | '))+'</div>':'<div class="nt">श्लोकपाठः अत्र न दत्तः — पदानि अधो दृश्यन्ते</div>')+'</div>';
  var step='<div class="step"><button class="btn" id="prev"'+(i<1?' disabled':'')+'>← पूर्वः</button><select id="vsel" aria-label="श्लोकः">'+opts+'</select><button class="btn" id="next"'+(i>=st.verses.length-1?' disabled':'')+'>अग्रिमः →</button></div>';
  $('main').innerHTML=step+leaf+HEAD+(ws.length?ws.map(function(w){return row(w,'verse')}).join(''):'<div class="empty">पदानि न सन्ति</div>')+
    '<p class="muted" style="text-align:center">पदक्रमः श्लोकपाठेन अनुमितः · word order is inferred from the verse text.</p>';
  ruler();try{localStorage.setItem('padakosha-v',v)}catch(e){}
}
function match(w){
  if(st.verse&&(w.verses||[]).indexOf(parseInt(st.verse,10))<0)return false;
  if(st.type&&short(w.word_type)!==st.type)return false;
  if(st.flag&&!flagged(w))return false;
  if(st.q){var hay=[w.word,w.iast,w.pratipadika,w.dhatu,w.meaning_en,w.samasa_split].join(' ').toLowerCase();if(hay.indexOf(st.q)<0)return false}
  return true;
}
function renderLex(keep){
  var tc={};st.words.forEach(function(w){var t=short(w.word_type);tc[t]=(tc[t]||0)+1});
  var to='<option value="">सर्वे प्रकाराः</option>'+Object.keys(tc).sort(function(a,b){return tc[b]-tc[a]}).map(function(t){return '<option value="'+esc(t)+'"'+(st.type===t?' selected':'')+'>'+esc(t)+' ('+dn(tc[t])+')</option>'}).join('');
  var vo='<option value="">सर्वे श्लोकाः</option>'+st.verses.map(function(x){return '<option value="'+x+'"'+(String(x)===st.verse?' selected':'')+'>श्लोकः '+dn(x)+'</option>'}).join('');
  var list=st.words.filter(match);
  $('main').innerHTML='<div class="tools"><input type="search" id="q" placeholder="पदं गवेषय — search word, IAST, stem, root…" value="'+esc(st.q)+'"><select id="tsel">'+to+'</select><select id="vf">'+vo+'</select>'+
    '<label><input type="checkbox" id="fl"'+(st.flag?' checked':'')+'> परीक्षणीयानि एव</label><span class="cnt">'+dn(list.length)+' / '+dn(st.words.length)+' पदानि</span></div>'+HEAD+
    (list.length?list.map(function(w){return row(w,'lex')}).join(''):'<div class="empty">कोऽपि शब्दो न लब्धः · no match</div>');
  if(keep){var q=$('q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}
  $('ruler').innerHTML='';
}
function render(keep){st.mode==='verse'?renderVerse():renderLex(keep);
  $('m-verse').setAttribute('aria-pressed',st.mode==='verse');$('m-lex').setAttribute('aria-pressed',st.mode==='lex');}
function setCorpus(d){
  data=d;st.words=d.words;var s={};d.words.forEach(function(w){(w.verses||[]).forEach(function(v){s[v]=1})});
  st.verses=Object.keys(s).map(Number).sort(function(a,b){return a-b});
  if(st.verses.indexOf(st.v)<0)st.v=st.verses[0];
  var m=d.corpus_meta||{};$('scope').textContent=' '+(m.kanda||'').split('/')[0].trim()+' · सर्गः '+dn(m.sarga||'')+' · श्लोक '+(m.verses_covered||'')+' · '+dn(d.words.length)+' पदानि';
  $('disc').textContent=m.important_disclaimer||'';
  render();
}
document.addEventListener('click',function(e){
  var t=e.target,s=t.closest&&t.closest('.sum');
  if(s){var r=s.parentNode;r.classList.toggle('open');s.setAttribute('aria-expanded',r.classList.contains('open'));return}
  var k=t.closest&&t.closest('.tick');if(k){st.v=+k.dataset.v;render();window.scrollTo(0,0);return}
  if(t.id==='prev'||t.id==='next'){var i=st.verses.indexOf(st.v)+(t.id==='next'?1:-1);if(i>=0&&i<st.verses.length){st.v=st.verses[i];render()}}
});
document.addEventListener('change',function(e){var t=e.target;
  if(t.id==='vsel'){st.v=+t.value;render()}
  else if(t.id==='tsel'){st.type=t.value;render()}
  else if(t.id==='vf'){st.verse=t.value;render()}
  else if(t.id==='fl'){st.flag=t.checked;render()}
  else if(t.id==='file'){load(t.files[0])}
});
document.addEventListener('input',function(e){if(e.target.id==='q'){st.q=e.target.value.trim().toLowerCase();render(true)}});
document.addEventListener('keydown',function(e){
  if(st.mode!=='verse'||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  var i=st.verses.indexOf(st.v);
  if(e.key==='ArrowRight'&&i<st.verses.length-1){st.v=st.verses[i+1];render()}
  if(e.key==='ArrowLeft'&&i>0){st.v=st.verses[i-1];render()}
});
$('m-verse').onclick=function(){st.mode='verse';render()};
$('m-lex').onclick=function(){st.mode='lex';render()};
$('expand').onclick=function(){st.all=!st.all;this.textContent=st.all?'सर्वं सङ्कोचय':'सर्वं विस्तारय';render()};
function load(f){if(!f)return;var r=new FileReader();
  r.onload=function(){try{var j=JSON.parse(r.result);if(!Array.isArray(j.words))throw new Error('no "words" array');j.corpus_meta=j.corpus_meta||{};setCorpus(j)}
    catch(err){$('main').innerHTML='<div class="empty">त्रुटिः · '+esc(err.message)+'</div>'}};
  r.readAsText(f)}
['dragenter','dragover'].forEach(function(n){window.addEventListener(n,function(e){e.preventDefault();document.body.classList.add('drag')})});
['dragleave','drop'].forEach(function(n){window.addEventListener(n,function(e){e.preventDefault();document.body.classList.remove('drag');if(n==='drop')load(e.dataTransfer.files[0])})});
setCorpus(data);
})();
</script>
</body>
</html>
